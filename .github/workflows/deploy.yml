# מפרסם את אתר ההדגמה ב-GitHub Pages בכל push ל-main, באותו תהליך שכל הקורסים
# משתמשים בו (build-course.yml).
# הפעלה חד-פעמית: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/build-course.yml
